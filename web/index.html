<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Notas · Demo</title>
  <meta name="description" content="Public demo of a supplier-invoice automation portal: e-mail ingestion, PDF/OCR extraction, approval workflow, month-by-month tracking, SharePoint archive and Finance spreadsheet. Fictional data.">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch (_) { document.documentElement.dataset.theme = 'dark'; }</script>
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
<div class="demo-banner">
  <span id="banner-text"></span>
  <span class="banner-actions">
    <span class="lang-toggle" role="group" aria-label="Language">
      <button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button>
    </span>
    <button class="link" id="btn-reset" type="button"></button>
    <a id="src-link" href="https://github.com/gualmeidap/portal-notas-demo" target="_blank" rel="noopener"></a>
  </span>
</div>
<div id="boot" class="boot" hidden>
  <div class="boot-card">
    <div class="logo-mark" id="boot-logo"></div>
    <h2>Portal Notas</h2>
    <p id="boot-step"></p>
    <div class="boot-bar"><div id="boot-fill"></div></div>
    <p class="muted small" id="boot-note"></p>
  </div>
</div>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="content">
    <header class="topbar" id="topbar"></header>
    <main id="page"></main>
  </div>
</div>
<dialog id="modal"><div class="modal-body" id="modal-body"></div></dialog>
<div id="toasts"></div>
<script src="static/mode.js"></script>
<script src="static/i18n.js"></script>
<script src="static/runtime.js"></script>
<script src="static/app.js"></script>
<script src="static/pages.js"></script>
<script src="static/boot.js"></script>
</body>
</html>
